[project]
name = "bayle"
version = "5.0.0-rc.3"
description = "An all-in-one toolkit for managing mods, profiles, and saves, with tools for resolving compatibility issues and merging mod changes."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Carlos Ray Segarra" }]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "py7zr>=1.1.3",
    "cryptography>=50.0.1",
    "constrata>=1.3.3",
    "velopack==1.2.161",  # must match the vpk CLI the release workflow packs with
    "sqlalchemy>=2.1.3,<3",  # 2.x: typed DeclarativeBase, Mapped[], mapped_column (storage/)
    "alembic>=1.20.0",  # storage/migrations, run in code at start-up
    "lupa>=2.8,<3",  # Lua 5.1 compiler: composed character scripts are checked before a build is used (decision 0006)
    "tomlkit==0.15.1",
]

[project.scripts]
bayle = "bayle.cli:main"
roundtable-souls = "bayle.cli:main"

[project.optional-dependencies]
qt = ["PySide6>=6.11.2"]
api = ["fastapi>=0.159.1", "uvicorn>=0.54.0", "pydantic-settings>=2.16.1"]

[dependency-groups]
dev = [
    "bayle[qt,api]",
    "pytest>=9.0.2",
    "httpx>=0.28.1",
    "coverage>=7.13.0",
    "ruff>=0.16.9",
    "pyinstaller>=6.22.3",
    "pillow>=12.3.0",
    "pyright>=1.1.414",
    "pre-commit>=4.6.2",
    "import-linter>=2.15",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/unit"]
markers = [
    "integration: needs a real Elden Ring save on this PC (skipped otherwise)",
    "real_recycle_bin: sends to the real Windows Recycle Bin; runs last, after every Qt window of the run",
]

[tool.coverage.run]
branch = true
source = ["src/bayle"]
omit = ["src/bayle/ui/*"]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E731", "E741", "B008", "B905"]

[tool.pyright]
include = ["src", "scripts", "tests"]
extraPaths = ["tests", "tests/unit"]  # what pytest's pythonpath puts on sys.path
pythonVersion = "3.14"
typeCheckingMode = "standard"
# Qt and the dict-shaped save data trip these without pointing at bugs; they stay visible as warnings.
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOptionalIterable = "error"
reportGeneralTypeIssues = "warning"
reportIndexIssue = "error"
reportCallIssue = "warning"
reportOperatorIssue = "warning"

# Import layers (technical specification §8.6). Each package may import only from the ones below it; "|" marks
# siblings that may not import each other, ":" siblings that may. Names are today's; the contract changes in the
# commit that renames a package. Lines in ignore_imports are known violations, each removed by the step it names.
# Run: uv run lint-imports --no-cache
[tool.importlinter]
root_package = "bayle"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
exhaustive = false
layers = [
    "bayle.cli",
    "bayle.app",
    "bayle.ui | bayle.api",
    "bayle.session",
    "bayle.views",
    "bayle.services",
    "bayle.mods | bayle.saves | bayle.coop | bayle.updates",
    "bayle.overhauls",
    "bayle.merging",
    "bayle.formats | bayle.game",
    "bayle.storage",
    "bayle.config",
    "bayle.platform",
]

[[tool.importlinter.contracts]]
name = "No Qt below the UI"
type = "forbidden"
source_modules = [
    "bayle.session",
    "bayle.services",
    "bayle.mods",
    "bayle.saves",
    "bayle.coop",
    "bayle.updates",
    "bayle.overhauls",
    "bayle.merging",
    "bayle.formats",
    "bayle.game",
    "bayle.storage",
    "bayle.config",
    "bayle.platform",
]
forbidden_modules = ["PySide6", "shiboken6"]

[[tool.importlinter.contracts]]
name = "The API has no Qt"
type = "forbidden"
source_modules = ["bayle.api"]
forbidden_modules = ["PySide6", "shiboken6", "bayle.ui"]

[[tool.importlinter.contracts]]
name = "Views are Qt-free and know nothing of the UI"
type = "forbidden"
source_modules = ["bayle.views"]
forbidden_modules = ["PySide6", "shiboken6", "bayle.ui"]
