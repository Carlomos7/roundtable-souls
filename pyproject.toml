[project]
name = "roundtable-souls"
version = "3.0.0"
description = "Launcher and save toolkit for modded Elden Ring: me3 profiles, Seamless Co-op settings, save checks and repairs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carlos Ray Segarra" }]
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.11.2",
    "PySide6-Fluent-Widgets>=1.11.3",
    "pydantic>=2.13.5",
    "py7zr>=1.1.3",
]

[project.scripts]
roundtable-souls = "roundtable_souls:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "coverage>=7.13.0",
    "ruff>=0.16.9",
    "pyinstaller>=6.22.3",
    "pillow>=12.3.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["integration: needs a real Elden Ring save on this PC (skipped otherwise)"]

[tool.coverage.run]
branch = true
source = ["src/roundtable_souls"]
omit = ["src/roundtable_souls/ui/*"]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E731", "E741", "B008", "B905"]
