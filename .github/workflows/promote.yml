name: Promote

# Makes a beta release stable: the same release and files the Release workflow built, tested, signed and published as
# a pre-release, now marked the latest release, which the launcher's Stable channel offers. Nothing is rebuilt.
# Run it by hand from the Actions tab with the tag (v3.17.0).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The beta release to make stable (vX.Y.Z)"
        required: true

permissions:
  contents: write
  actions: read

# Queues behind a release being built or published, never alongside it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      PUBLIC_KEY: repo/src/roundtable_souls/data/release-signing.pub
    steps:
    - name: Check the release can be promoted
      run: |
        fail() { echo "::error::$1"; exit 1; }
        # The launcher's Stable channel refuses versions with a suffix (3.17.0-rc.1): only vX.Y.Z can be stable.
        [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "$TAG is not vX.Y.Z; a suffixed version stays a beta"
        state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
          --jq '"\(.isDraft) \(.isPrerelease)"') || fail "there is no release $TAG"
        [ "$state" = "false true" ] || fail "$TAG is not a published beta (draft prerelease: $state)"
        latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
        if [ -n "$latest" ]; then
          newest=$(printf '%s\n%s\n' "${latest#v}" "${TAG#v}" | sort -V | tail -n1)
          [ "$newest" = "${TAG#v}" ] && [ "$latest" != "$TAG" ] || fail "$TAG is not newer than the stable $latest"
        fi
        run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$TAG" --event push --limit 1 \
          --json conclusion,databaseId --jq '.[0] | "\(.conclusion) \(.databaseId)"')
        [ "${run%% *}" = "success" ] || fail "the Release workflow for $TAG did not succeed ($run)"
        echo "promoting $TAG (beta, built and tested by Release run ${run##* }) over the stable ${latest:-none}"

    # Only the public key the launcher ships: every signature is checked against exactly what users verify with.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: repo
        sparse-checkout: src/roundtable_souls/data/release-signing.pub
        sparse-checkout-cone-mode: false

    - name: Install minisign (pinned release, checked against its known SHA-256)
      run: |
        curl -fsSL -o "$RUNNER_TEMP/minisign.tgz" https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
        echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $RUNNER_TEMP/minisign.tgz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/minisign.tgz" -C "$RUNNER_TEMP" minisign-linux/x86_64/minisign
        mkdir -p "$RUNNER_TEMP/bin" && mv "$RUNNER_TEMP/minisign-linux/x86_64/minisign" "$RUNNER_TEMP/bin/minisign"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: Download the release and check every file against its checksum and every signature
      run: |
        mkdir check && cd check
        gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
        sha256sum --check SHA256SUMS.txt
        for f in releases.win.json releases.linux.json SHA256SUMS.txt; do minisign -V -p "../$PUBLIC_KEY" -m "$f"; done

    - name: Make it the stable release
      run: |
        gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
        now=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
        [ "$now" = "$TAG" ] || { echo "::error::the latest release is $now, not $TAG"; exit 1; }
        echo "$TAG is now the stable release"
