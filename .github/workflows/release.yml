name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

# Releases queue behind each other; one is never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    # A release must come from a commit on main whose version matches the tag.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Tagged commit is on main
      run: |
        git fetch --no-tags origin main
        git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main" >&2; exit 1; }

    - name: Tag matches the package version
      run: |
        version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
        [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match version $version" >&2; exit 1; }

  windows:
    needs: verify
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        enable-cache: true
        python-version-file: ".python-version"

    - name: Install dependencies (exactly as locked)
      run: uv sync --locked

    - name: Lint and type check
      run: |
        uv run ruff check .
        uv run pyright

    - name: Run tests
      run: uv run pytest

    - name: Install Inno Setup
      shell: pwsh
      run: |
        if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

    - name: Build the exe, installer and zip
      run: uv run python scripts/build.py --no-test

    - name: Smoke-test the exe
      shell: bash
      run: test -f dist/share/RoundtableSouls-Setup.exe && ./dist/RoundtableSouls.exe --shots shots && ls shots

    # The latest published release, updated by this build's setup the way Update now runs it; then a refused
    # downgrade, the launcher reopened after it, and an uninstall that keeps the settings.
    - name: Update test (previous release to this build)
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/ci/installer-update-test.ps1

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: windows
        retention-days: 7
        path: |
          dist/share/RoundtableSouls-Setup.exe
          dist/share/RoundtableSouls.zip
          dist/share/RoundtableSouls.exe

  linux:
    needs: verify
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    # Built on the oldest supported Ubuntu so the binary also runs where glibc is older; SteamOS is newer.
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        enable-cache: true
        python-version-file: ".python-version"

    - name: Install Qt runtime libraries
      run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

    - name: Install dependencies (exactly as locked)
      run: uv sync --locked

    - name: Run tests
      run: uv run pytest

    - name: Build the program and archive
      run: uv run python scripts/build.py --no-test

    - name: Smoke-test the program
      run: ./dist/RoundtableSouls --check

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: linux
        retention-days: 7
        path: dist/share/RoundtableSouls-linux-x86_64.tar.gz

  publish:
    needs: [verify, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      FILES: RoundtableSouls-Setup.exe RoundtableSouls.zip RoundtableSouls.exe RoundtableSouls-linux-x86_64.tar.gz
      PUBLIC_KEY: repo/src/roundtable_souls/data/release-signing.pub
    steps:
    # Only the public key the launcher ships: the signature is checked against exactly what users verify with.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: repo
        sparse-checkout: src/roundtable_souls/data/release-signing.pub
        sparse-checkout-cone-mode: false

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: assets
        merge-multiple: true

    - name: Install minisign (pinned release, checked against its known SHA-256)
      run: |
        curl -fsSL -o "$RUNNER_TEMP/minisign.tgz" https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
        echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $RUNNER_TEMP/minisign.tgz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/minisign.tgz" -C "$RUNNER_TEMP" minisign-linux/x86_64/minisign
        mkdir -p "$RUNNER_TEMP/bin" && mv "$RUNNER_TEMP/minisign-linux/x86_64/minisign" "$RUNNER_TEMP/bin/minisign"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    # Update now refuses a release whose checksums are not signed with the project key, or whose trusted comment
    # names another version. The private key exists only as the MINISIGN_KEY secret and in this step's temp file.
    - name: Checksums for every file, signed
      working-directory: assets
      env:
        MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
      run: |
        sha256sum $FILES > SHA256SUMS.txt && cat SHA256SUMS.txt
        [ -n "$MINISIGN_KEY" ] || { echo "the MINISIGN_KEY secret is not set" >&2; exit 1; }
        umask 077
        key="$RUNNER_TEMP/release.key"
        trap 'rm -f "$key"' EXIT
        printf '%s\n' "$MINISIGN_KEY" | tr -d '\r' > "$key"  # the key file was made on Windows
        minisign -S -s "$key" -m SHA256SUMS.txt -t "roundtable-souls ${GITHUB_REF_NAME#v}" </dev/null
        minisign -V -p "../$PUBLIC_KEY" -m SHA256SUMS.txt

    # Uploaded as a draft first, so nobody (and no update check) sees a half-uploaded release.
    - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        name: Roundtable Souls ${{ github.ref_name }}
        draft: true
        generate_release_notes: true
        files: |
          assets/RoundtableSouls-Setup.exe
          assets/RoundtableSouls.zip
          assets/RoundtableSouls.exe
          assets/RoundtableSouls-linux-x86_64.tar.gz
          assets/SHA256SUMS.txt
          assets/SHA256SUMS.txt.minisig

    - name: Download the draft back and check every file against its checksum and the signature
      run: |
        mkdir check && cd check
        gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
        sha256sum --check SHA256SUMS.txt
        minisign -V -p "../$PUBLIC_KEY" -m SHA256SUMS.txt

    # A tag with a hyphen (v3.14.0-rc.1) is a pre-release: offered only on the Beta channel, never marked latest.
    - name: Publish the verified release
      run: |
        if [[ "$GITHUB_REF_NAME" == *-* ]]; then
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
        else
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        fi
