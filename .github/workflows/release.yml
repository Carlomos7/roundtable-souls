name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version-file: ".python-version"

    - name: Install dependencies
      run: uv sync

    - name: Check the tag matches the package version
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        version=$(uv run python -c "import roundtable_souls; print(roundtable_souls.__version__)")
        tag="${GITHUB_REF_NAME#v}"
        if [ "$tag" != "$version" ]; then
          echo "tag v$tag does not match __version__ $version" >&2
          exit 1
        fi

    - name: Lint and type check
      run: |
        uv run ruff check .
        uv run pyright

    - name: Run tests
      run: uv run pytest

    - name: Build the exe and share bundle
      run: uv run python scripts/build.py --no-test

    - name: Smoke-test the exe
      shell: bash
      run: ./dist/RoundtableSouls.exe --shots shots && ls shots

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: RoundtableSouls
        path: |
          dist/share/RoundtableSouls.zip
          dist/RoundtableSouls.exe

    - name: Publish the GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: Roundtable Souls ${{ github.ref_name }}
        generate_release_notes: true
        files: |
          dist/share/RoundtableSouls.zip
          dist/RoundtableSouls.exe
