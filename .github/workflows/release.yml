name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version-file: ".python-version"

    - name: Install dependencies
      run: uv sync

    - name: Check the tag matches the package version
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        version=$(uv run python -c "import roundtable_souls; print(roundtable_souls.__version__)")
        tag="${GITHUB_REF_NAME#v}"
        if [ "$tag" != "$version" ]; then
          echo "tag v$tag does not match __version__ $version" >&2
          exit 1
        fi

    - name: Lint and type check
      run: |
        uv run ruff check .
        uv run pyright

    - name: Run tests
      run: uv run pytest

    - name: Install Inno Setup
      shell: pwsh
      run: |
        if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

    - name: Build the exe, installer and zip
      run: uv run python scripts/build.py --no-test

    - name: Smoke-test the exe
      shell: bash
      run: test -f dist/share/RoundtableSouls-Setup.exe && ./dist/RoundtableSouls.exe --shots shots && ls shots

    - uses: actions/upload-artifact@v7
      with:
        name: windows
        path: |
          dist/share/RoundtableSouls-Setup.exe
          dist/share/RoundtableSouls.zip
          dist/share/RoundtableSouls.exe

  linux:
    # Built on the oldest supported Ubuntu so the binary also runs where glibc is older; SteamOS is newer.
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version-file: ".python-version"

    - name: Install Qt runtime libraries
      run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

    - name: Install dependencies
      run: uv sync

    - name: Run tests
      run: uv run pytest

    - name: Build the program and archive
      run: uv run python scripts/build.py --no-test

    - name: Smoke-test the program
      run: ./dist/RoundtableSouls --check

    - uses: actions/upload-artifact@v7
      with:
        name: linux
        path: dist/share/RoundtableSouls-linux-x86_64.tar.gz

  publish:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: assets
        merge-multiple: true

    - name: Checksums for every file
      working-directory: assets
      run: sha256sum RoundtableSouls-Setup.exe RoundtableSouls.zip RoundtableSouls.exe RoundtableSouls-linux-x86_64.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt

    - uses: softprops/action-gh-release@v3
      with:
        name: Roundtable Souls ${{ github.ref_name }}
        generate_release_notes: true
        files: |
          assets/RoundtableSouls-Setup.exe
          assets/RoundtableSouls.zip
          assets/RoundtableSouls.exe
          assets/RoundtableSouls-linux-x86_64.tar.gz
          assets/SHA256SUMS.txt
