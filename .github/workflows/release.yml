name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

# Releases queue behind each other; one is never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    # A release must come from a commit on main whose version matches the tag.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Tagged commit is on main
      run: |
        git fetch --no-tags origin main
        git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main" >&2; exit 1; }

    - name: Tag matches the package version
      run: |
        version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
        [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match version $version" >&2; exit 1; }

  windows:
    needs: verify
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        enable-cache: true
        python-version-file: ".python-version"

    - name: Install dependencies (exactly as locked)
      run: uv sync --locked

    - name: Lint and type check
      run: |
        uv run ruff check .
        uv run pyright

    - name: Run tests
      run: uv run pytest

    - name: Install Inno Setup
      shell: pwsh
      run: |
        if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

    - name: Build the exe, installer and zip
      run: uv run python scripts/build.py --no-test

    - name: Smoke-test the exe
      shell: bash
      run: test -f dist/share/RoundtableSouls-Setup.exe && ./dist/RoundtableSouls.exe --shots shots && ls shots

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: windows
        retention-days: 7
        path: |
          dist/share/RoundtableSouls-Setup.exe
          dist/share/RoundtableSouls.zip
          dist/share/RoundtableSouls.exe

  linux:
    needs: verify
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    # Built on the oldest supported Ubuntu so the binary also runs where glibc is older; SteamOS is newer.
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        enable-cache: true
        python-version-file: ".python-version"

    - name: Install Qt runtime libraries
      run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

    - name: Install dependencies (exactly as locked)
      run: uv sync --locked

    - name: Run tests
      run: uv run pytest

    - name: Build the program and archive
      run: uv run python scripts/build.py --no-test

    - name: Smoke-test the program
      run: ./dist/RoundtableSouls --check

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: linux
        retention-days: 7
        path: dist/share/RoundtableSouls-linux-x86_64.tar.gz

  publish:
    needs: [verify, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      FILES: RoundtableSouls-Setup.exe RoundtableSouls.zip RoundtableSouls.exe RoundtableSouls-linux-x86_64.tar.gz
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: assets
        merge-multiple: true

    - name: Checksums for every file
      working-directory: assets
      run: sha256sum $FILES > SHA256SUMS.txt && cat SHA256SUMS.txt

    # Uploaded as a draft first, so nobody (and no update check) sees a half-uploaded release.
    - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        name: Roundtable Souls ${{ github.ref_name }}
        draft: true
        generate_release_notes: true
        files: |
          assets/RoundtableSouls-Setup.exe
          assets/RoundtableSouls.zip
          assets/RoundtableSouls.exe
          assets/RoundtableSouls-linux-x86_64.tar.gz
          assets/SHA256SUMS.txt

    - name: Download the draft back and check every file against its checksum
      run: |
        mkdir check && cd check
        gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
        sha256sum --check SHA256SUMS.txt

    - name: Publish the verified release
      run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
