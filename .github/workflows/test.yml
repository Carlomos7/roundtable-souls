name: Tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

env:
  # uv's own Python builds (python-build-standalone), not the runner's preinstalled ones: the runner's python.org
  # 3.14.7 carries SQLite 3.50.4, below what the launcher's database needs (docs/decisions/0005-storage.md)
  UV_PYTHON_PREFERENCE: only-managed

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - id: filter
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        # Pushes compare with the previous push to the same branch (a new branch compares with main);
        # pull requests compare with their base branch.
        base: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
        filters: |
          code:
            - "src/**"
            - "tests/**"
            - "scripts/**"
            - "pyproject.toml"
            - "uv.lock"
            - ".python-version"
            - ".github/workflows/**"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        enable-cache: true
        version-file: ".python-version"

    - name: Install Qt runtime libraries
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

    - name: Install dependencies (exactly as locked)
      run: uv sync --locked

    - name: Lint and format
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Type check
      run: uv run pyright

    - name: Import layers
      run: uv run lint-imports --no-cache

    - name: Run tests with coverage
      run: |
        uv run coverage erase
        uv run coverage run -m pytest
        uv run coverage report
        uv run coverage html

    - name: Upload HTML coverage report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-html-${{ matrix.os }}
        path: htmlcov/
        retention-days: 14

  # The one check main requires: passes when the tests passed, or were skipped because only docs changed.
  tests-passed:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Summarise
      env:
        CHANGES: ${{ needs.changes.result }}
        TESTS: ${{ needs.test.result }}
      run: |
        echo "changes: $CHANGES, tests: $TESTS"
        [ "$CHANGES" = "success" ] || exit 1
        [ "$TESTS" = "success" ] || [ "$TESTS" = "skipped" ] || exit 1
